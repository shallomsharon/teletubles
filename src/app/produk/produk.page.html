<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Daftar Produk
    </ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar [(ngModel)]="searchTerm" placeholder="Cari nama produk..."></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let item of filteredProducts">
        <ion-card color="light">
          <img [src]="item.image" [alt]="item.name" class="product-img" />
          <ion-card-content>
            <h2 class="product-title" (click)="goToDetail(item)">
              {{ item.name | uppercase }}
            </h2>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" style="margin-bottom: 55px;">
    <ion-fab-button routerLink="/new-produk" color="success">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
