<ion-header [translucent]="true">
  <ion-toolbar style="--background: #D4E0C4;">
    <ion-buttons slot="start">
      <ion-menu-button color="dark"></ion-menu-button>
    </ion-buttons>
    <ion-title style="color: #1F2937; font-weight: bold;">Profil Akun</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #EFEFEF;">
  
  <div style="max-width: 600px; margin: 0 auto; padding-top: 10px;">
    
    
    <ion-card id="myProfileCard" style="background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; opacity: 0;">
      
      
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
        <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: #e5e7eb; flex-shrink: 0; border: 2px solid #D4E0C4;">
          <img src="assets/img/profile.jpg" alt="Foto Profil" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://ionicframework.com/docs/img/demos/avatar.svg'">
        </div>
        <div>
          <h2 style="font-size: 20px; font-weight: bold; color: #1F2937; margin: 0 0 4px 0;">Daniel Hary Prasetyo</h2>
          <p style="color: #6B7280; font-size: 14px; margin: 0;">Jurusan Informatika UBAYA</p>
        </div>
      </div>

      
      <div style="border-top: 1px solid #f3f4f6; padding-top: 15px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: #4b5563; font-size: 14px;">
          <ion-icon name="location-outline" style="font-size: 18px; color: #8C9E75;"></ion-icon>
          <span>Raya Kalirungkut Surabaya</span>
        </div>
      </div>

    </ion-card>


    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <div style="background: #ffffff; border: 1px solid #d1d5db; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #374151; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
        <ion-icon name="key-outline" style="color: #d97706;"></ion-icon>
        <span>Super Ganteng</span>
      </div>
      <div style="background: #ffffff; border: 1px solid #d1d5db; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #374151; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
        <ion-icon name="key-outline" style="color: #d97706;"></ion-icon>
        <span>Super Pintar</span>
      </div>
    </div>

  </div>

</ion-content>
