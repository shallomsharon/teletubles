<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Dashboard
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dashboard</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label class="header">
      <h1>Selamat datang, Toko Makmur Jaya! </h1>
      <p>Berikut ringkasan keuangan bisnis Anda hari ini.</p>
    </ion-label>
  </ion-item>

  <div id="container">
    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="7">
          <ion-card>
            <ion-card-header>
              <ion-card-title>Performa Warung</ion-card-title>
            </ion-card-header>
            <ion-grid class="inside">
              <ion-row>
                <ion-col size="6">
                  <ion-label class="grid">
                    <h3>Total Transaksi</h3>
                    <h1> {{ countTotalTransactions() }} </h1>
                  </ion-label>
                </ion-col>
                <ion-col size="6">
                  <ion-label class="grid">
                    <h3>Produk Terlaris</h3>
                    <h1> {{ getMostSoldProduct() }} </h1>
                  </ion-label>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card>
        </ion-col>
        <ion-col size="12" size-md="5">
          <ion-card>
            <ion-card-header>
              <ion-card-title>Jumlah Produk</ion-card-title>
            </ion-card-header>
            <ion-grid class="inside">
              <ion-row>
                <ion-col size="12">
                  <ion-label class="grid" >
                    <h1> {{ countTotalProducts() }} </h1>
                  </ion-label>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
