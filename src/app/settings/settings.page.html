<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content #aboutContent id="aboutContent" class="ion-padding" [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Pengaturan</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset="true">
    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>Mode Gelap </ion-label>
      <ion-toggle [checked]="isDarkMode" (ionChange)="onToggleDarkMode($event)"></ion-toggle>

    </ion-item>

    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-label>Notifikasi Transaksi</ion-label>
      <ion-toggle [(ngModel)]="notificationsEnabled"></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="language-outline" slot="start"></ion-icon>
      <ion-label>Bahasa</ion-label>
      <ion-select [(ngModel)]="selectedLanguage" interface="action-sheet">
        <ion-select-option value="id">Bahasa Indonesia</ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>

  <ion-list inset="true">
    <ion-item lines="none">
      <ion-icon name="information-circle-outline" slot="start"></ion-icon>
      <ion-label>Versi Aplikasi</ion-label>
      <ion-text slot="end" color="medium">
        <p>v1.0.0</p>
      </ion-text>
    </ion-item>
  </ion-list>

</ion-content>
